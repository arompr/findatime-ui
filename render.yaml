services:
  - type: web
    name: findatime-ui-staging
    runtime: static
    branch: main
    buildCommand: |
      test -n "$GITHUB_TOKEN" || { echo "GITHUB_TOKEN env var is required"; exit 1; }
      cat > .npmrc <<EOF
      @arompr:registry=https://npm.pkg.github.com
      //npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}
      EOF
      npm ci
      npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://findatime-api-staging.onrender.com
      - key: GITHUB_TOKEN
        sync: false
      - key: SKIP_INSTALL_DEPS
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
